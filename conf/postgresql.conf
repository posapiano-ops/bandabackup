#===========================================
# RIPRISTINO POINT-IN-TIME
#===========================================

# Per ripristino PITR (Point-In-Time Recovery):
# 
# 1. Ripristina backup base
# 2. Crea recovery.conf (PostgreSQL < 12) o modifica postgresql.conf:
# 
# restore_command = 'cp /backup/postgresql/wal_archive/%f %p'
# recovery_target_time = '2025-10-16 12:00:00'  # Punto nel tempo
# recovery_target_action = 'promote'             # O 'pause' per ispezionare
# 
# 3. Avvia PostgreSQL che applicherà automaticamente i WAL

#===========================================
# VERIFICA CONFIGURAZIONE
#===========================================

# Dopo aver modificato postgresql.conf:
# sudo systemctl restart postgresql
# 
# Verifica settings:
