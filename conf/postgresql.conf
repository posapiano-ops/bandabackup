# Configurazione postgresql.conf per backup incrementali WAL
# Percorso: /var/lib/pgsql/data/postgresql.conf o /etc/postgresql/*/main/postgresql.conf

#===========================================
# CONFIGURAZIONE WAL ARCHIVING
#===========================================

# Abilita WAL archiving per backup point-in-time
wal_level = replica                    # Livello minimo per archiving
archive_mode = on                      # Abilita archiviazione
archive_command = 'test ! -f /backup/postgresql/wal_archive/%f && cp %p /backup/postgresql/wal_archive/%f'
archive_timeout = 1800                 # Forza archiving ogni 30 minuti (in secondi)

# WAL settings
max_wal_senders = 10                   # Numero massimo connessioni replication
wal_keep_size = 1GB                    # Spazio WAL da mantenere (PostgreSQL 13+)
# wal_keep_segments = 64               # Per PostgreSQL < 13

# Checkpoint settings (ottimizzazione performance)
checkpoint_timeout = 15min             # Tempo massimo tra checkpoint
checkpoint_completion_target = 0.9     # Distribuzione I/O checkpoint
max_wal_size = 4GB                     # Massima dimensione WAL
min_wal_size = 1GB                     # Minima dimensione WAL

#===========================================
# CONFIGURAZIONE REPLICATION (OPZIONALE)
#===========================================

# Per configurare replica streaming (standby server)
# hot_standby = on                     # Abilita su standby
# hot_standby_feedback = on            # Feedback da standby a master

